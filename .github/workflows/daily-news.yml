name: Daily Tech News

on:
  schedule:
    # 每天 UTC 22:00 = CST 06:00（北京时间）；考虑 Actions 排队延迟，实际约 07:30-08:00 到达
    - cron: '0 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run news collector
        shell: pwsh
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          pwsh ./daily_news.ps1 -SendKey "$env:SENDKEY"
